# ============================================================================
#  tmux.conf — themed to match the SketchyBar rice (Catppuccin Mocha)
#
#  Palette (mirrors ~/.config/sketchybar/sketchybarrc):
#    accent / mauve : #cba6f7   (sketchybar 0xffcba6f7)
#    text           : #cdd6f4   (sketchybar 0xffcdd6f4)
#    base bg        : #1e1e2e   (sketchybar 0x1e1e2e)
#    surface        : #313244   (sketchybar 0x313244)
#    overlay/dim    : #6c7086
# ============================================================================

# --- General ---------------------------------------------------------------
set -g default-terminal "tmux-256color"
set -ga terminal-overrides ",*256col*:Tc"   # truecolor passthrough
set -g mouse on
set -g base-index 1                          # windows start at 1
setw -g pane-base-index 1
set -g renumber-windows on
set -g history-limit 10000
set -sg escape-time 10
set -g focus-events on

# --- Status bar ------------------------------------------------------------
set -g status on
set -g status-interval 5
set -g status-position bottom
set -g status-justify left
set -g status-style "bg=#1e1e2e,fg=#cdd6f4"

# Left: session name in an accent pill
set -g status-left-length 40
set -g status-left "#[bg=#cba6f7,fg=#1e1e2e,bold] #S #[bg=#1e1e2e,fg=#1e1e2e] "

# Right: date + time
set -g status-right-length 80
set -g status-right "#[bg=#313244,fg=#cdd6f4] %Y-%m-%d #[bg=#cba6f7,fg=#1e1e2e,bold] %H:%M "

# Windows
set -g window-status-separator ""
set -g window-status-format "#[bg=#1e1e2e,fg=#6c7086]  #I:#W  "
set -g window-status-current-format "#[bg=#313244,fg=#cba6f7,bold]  #I:#W  "
set -g window-status-activity-style "fg=#cba6f7"

# --- Panes -----------------------------------------------------------------
set -g pane-border-style "fg=#313244"
set -g pane-active-border-style "fg=#cba6f7"
set -g display-panes-colour "#313244"
set -g display-panes-active-colour "#cba6f7"

# --- Messages / command line ----------------------------------------------
set -g message-style "bg=#313244,fg=#cba6f7"
set -g message-command-style "bg=#313244,fg=#cba6f7"
set -g mode-style "bg=#cba6f7,fg=#1e1e2e"

# --- Clock -----------------------------------------------------------------
set -g clock-mode-colour "#cba6f7"
set -g clock-mode-style 24
