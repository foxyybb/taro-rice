[Setting]
spotify_path           = /Applications/Spotify.app/Contents/Resources
prefs_path             = __HOME__/Library/Application Support/Spotify/prefs
color_scheme           = 
inject_theme_js        = 1
replace_colors         = 1
overwrite_assets       = 0
spotify_launch_flags   = 
current_theme          = marketplace
inject_css             = 1
check_spicetify_update = 1
always_enable_devtools = 0

[Preprocesses]
remove_rtl_rule    = 1
expose_apis        = 1
disable_sentry     = 1
disable_ui_logging = 1

[AdditionalOptions]
extensions            = 
custom_apps           = marketplace
sidebar_config        = 0
home_config           = 1
experimental_features = 1

